name: Deploy ADM Specification Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive ADM version from tags
        shell: bash
        run: |
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          # Write 0.1.0, not v0.1.0: the same form as the tracked _data/adm.yml,
          # the CHANGELOG headings and docs/index.md's fallback, so the site
          # shows the same version whichever build published it.
          TAG="${TAG#v}"
          if [ -z "$TAG" ]; then
            TAG="0.0.0-unreleased"
          fi
          mkdir -p _data
          printf 'version: "%s"\n' "$TAG" > _data/adm.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
